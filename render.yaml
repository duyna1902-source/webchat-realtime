services:
  - type: web
    name: webchat-realtime
    env: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    # Applies pending Prisma migrations (prisma/migrations) before the server starts.
    startCommand: npm run db:deploy --workspace=server && npm run start --workspace=server
    healthCheckPath: /health
    # Never put a secret value in this file: it is public. Every secret uses `sync: false`,
    # so Render asks for its value on the first deploy and keeps it in the dashboard.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_ORIGIN
        value: https://webchat-realtime.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: attachments
      - key: GIPHY_API_KEY
        sync: false
